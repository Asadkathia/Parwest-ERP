body{background:#f1f4f9;font-family:var(--font-ui);margin:0;color:var(--text-primary);}
.page{max-width:1200px;margin:0 auto;padding:48px 40px;}
.cover{background:var(--sidebar-bg);border-radius:var(--radius-xl);padding:48px;margin-bottom:48px;display:flex;align-items:center;justify-content:space-between;}
.cover-title{font-size:var(--text-32);font-weight:800;color:#fff;letter-spacing:-0.5px;}
.cover-sub{font-size:var(--text-14);color:rgba(226,232,240,0.55);margin-top:6px;}
.cover-meta{display:flex;flex-direction:column;gap:6px;text-align:right;}
.cover-meta span{font-size:var(--text-12);font-family:var(--font-mono);color:rgba(226,232,240,0.4);}
.section{margin-bottom:48px;}
.section-title{font-size:var(--text-20);font-weight:700;color:var(--text-primary);margin-bottom:8px;}
.section-sub{font-size:var(--text-13);color:var(--text-muted);margin-bottom:20px;}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
.icon-card{background:#fff;border:1px solid var(--border-default);border-radius:var(--radius-md);padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:default;transition:box-shadow var(--duration-fast);}
.icon-card:hover{box-shadow:var(--shadow-sm);border-color:var(--brand-300);}
.icon-cell{display:flex;align-items:center;justify-content:center;gap:8px;}
.icon-cell svg{display:block;}
.icon-info{flex:1;min-width:0;}
.icon-v0name{font-size:var(--text-12);font-weight:700;color:var(--text-primary);font-family:var(--font-mono);}
.icon-lucide{font-size:var(--text-11);color:var(--brand-600);font-family:var(--font-mono);margin-top:1px;}
.icon-use{font-size:10px;color:var(--text-muted);margin-top:3px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
/* Size demo row */
.size-row{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
.sz-label{font-size:10px;font-family:var(--font-mono);color:var(--text-muted);width:32px;flex-shrink:0;}
/* Surface demos */
.surface-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.surface-card{border-radius:var(--radius-md);padding:20px;display:flex;flex-wrap:wrap;gap:12px;}
.surface-card.light{background:#fff;border:1px solid var(--border-default);}
.surface-card.dark{background:var(--sidebar-bg);}
.surface-card.brand{background:var(--brand-600);}
.surface-label{font-size:var(--text-11);font-weight:700;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:12px;width:100%;}
/* Search */
.search-bar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:9px 14px;max-width:360px;margin-bottom:20px;}
.search-bar input{border:none;outline:none;font-family:var(--font-ui);font-size:var(--text-13);color:var(--text-primary);flex:1;background:transparent;}
/* Toast copy */
.copy-toast{position:fixed;bottom:24px;right:24px;background:var(--slate-900);color:#fff;padding:8px 16px;border-radius:var(--radius-sm);font-size:var(--text-13);font-family:var(--font-mono);opacity:0;pointer-events:none;transition:opacity var(--duration-fast);}
.copy-toast.show{opacity:1;}
/* Contrast table */
.contrast-table{width:100%;border-collapse:collapse;font-size:var(--text-12);}
.contrast-table th{padding:8px 12px;text-align:left;background:var(--bg-subtle);border:1px solid var(--border-default);font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;}
.contrast-table td{padding:8px 12px;border:1px solid var(--border-default);font-family:var(--font-mono);}
.pass{color:var(--success-600);font-weight:700;}
</style>

function LucideIcon({name, size=16, color='currentColor'}){
  const ref = useRef(null);
  useEffect(()=>{
    if(!window.lucide||!ref.current) return;
    const iconFn = window.lucide[name];
    if(!iconFn) return;
    const svg = iconFn([size, size, color, 'none', 1.5]);
    if(typeof svg==='string') ref.current.innerHTML = svg;
    else {
      // lucide UMD returns createElement call
      const el = document.createElementNS('http://www.w3.org/2000/svg','svg');
      el.setAttribute('width',size); el.setAttribute('height',size);
      el.setAttribute('viewBox','0 0 24 24');
      el.setAttribute('fill','none');
      el.setAttribute('stroke',color);
      el.setAttribute('stroke-width','1.5');
      el.setAttribute('stroke-linecap','round');
      el.setAttribute('stroke-linejoin','round');
      // use lucide paths via createElement fallback
      ref.current.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:block">${getPath(name)}</svg>`;
      return;
    }
    const svgEl = ref.current.querySelector('svg');
    if(svgEl){ svgEl.setAttribute('stroke-width','1.5'); svgEl.style.display='block'; }
  },[name,size,color]);
  return <span ref={ref} style={{display:'inline-flex',alignItems:'center',justifyContent:'center'}}/>;
}

    Printer:"<polyline points='6 9 6 2 18 2 18 9'/><path d='M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2'/><rect x='6' y='14' width='12' height='8'/>",
    MoreHorizontal:"<circle cx='12' cy='12' r='1'/><circle cx='19' cy='12' r='1'/><circle cx='5' cy='12' r='1'/>",
    Percent:"<line x1='19' y1='5' x2='5' y2='19'/><circle cx='6.5' cy='6.5' r='2.5'/><circle cx='17.5' cy='17.5' r='2.5'/>",
    Banknote:"<rect x='2' y='6' width='20' height='12' rx='2'/><circle cx='12' cy='12' r='2'/><path d='M6 12h.01M18 12h.01'/>",
    Columns3:"<rect width='4' height='16' x='2' y='4' rx='1'/><rect width='4' height='16' x='10' y='4' rx='1'/><rect width='4' height='16' x='18' y='4' rx='1'/>",
    ArrowUpNarrowWide:"<path d='M3 8L7 4l4 4M7 4v16'/><path d='M11 12h4M11 16h6M11 20h8'/>",
    ArrowDownNarrowWide:"<path d='M3 16l4 4 4-4M7 20V4'/><path d='M11 4h4M11 8h6M11 12h8'/>",
    Layers:"<polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/>",
    UserPlus:"<path d='M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2'/><circle cx='9' cy='7' r='4'/><line x1='19' y1='8' x2='19' y2='14'/><line x1='22' y1='11' x2='16' y2='11'/>",
    UserCheck:"<path d='M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2'/><circle cx='9' cy='7' r='4'/><polyline points='16 11 18 13 22 9'/>",
    UserX:"<path d='M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2'/><circle cx='9' cy='7' r='4'/><line x1='17' y1='8' x2='23' y2='14'/><line x1='23' y1='8' x2='17' y2='14'/>",
    Ticket:"<path d='M15 5v2M15 11v2M15 17v2M5 5h14a2 2 0 012 2v3a2 2 0 000 4v3a2 2 0 01-2 2H5a2 2 0 01-2-2v-3a2 2 0 000-4V7a2 2 0 012-2z'/>",
    Star:"<polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/>",
    Briefcase:"<rect x='2' y='7' width='20' height='14' rx='2' ry='2'/><path d='M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16'/><line x1='2' y1='14' x2='22' y2='14'/>",
    GraduationCap:"<path d='M22 10v6M2 10l10-5 10 5-10 5z'/><path d='M6 12v5c3 3 9 3 12 0v-5'/>",
    AlertCircle:"<circle cx='12' cy='12' r='10'/><line x1='12' y1='8' x2='12' y2='12'/><line x1='12' y1='16' x2='12.01' y2='16'/>",
    Helpercircle:"<circle cx='12' cy='12' r='10'/><path d='M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3'/><line x1='12' y1='17' x2='12.01' y2='17'/>",
    ChevronLeft:"<polyline points='15 18 9 12 15 6'/>",
    ArrowRight:"<line x1='5' y1='12' x2='19' y2='12'/><polyline points='12 5 19 12 12 19'/>",
  };
  return p[name] || `<circle cx="12" cy="12" r="4"/>`;
}

function SvgIcon({name, size=16, color='currentColor'}){
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" style={{display:'block',flexShrink:0}} dangerouslySetInnerHTML={{__html:getPath(name)}}/>
  );
}

function copyToClipboard(text, setCopied){
  navigator.clipboard.writeText(text).then(()=>{ setCopied(text); setTimeout(()=>setCopied(null),2000); });
}

function App(){
  const [search,setSearch]=useState('');
  const [copied,setCopied]=useState(null);

  const filtered = ICONS.filter(ic=>
    !search || ic.v0.toLowerCase().includes(search.toLowerCase()) ||
    ic.lucide.toLowerCase().includes(search.toLowerCase()) ||
    ic.use.toLowerCase().includes(search.toLowerCase())
  );

  return (
    <div className="page">
      {/* Cover */}
      <div className="cover">
        <div>
          <div style={{fontSize:'var(--text-11)',fontWeight:700,letterSpacing:'1.5px',textTransform:'uppercase',color:'var(--brand-400)',marginBottom:8}}>v1.1 Addendum</div>
          <div className="cover-title">Icon Reference</div>
          <div className="cover-sub">{ICONS.length} icons · lucide-react · stroke 1.5 · default 16px · currentColor</div>
        </div>
        <div className="cover-meta">
          <span>lucide-react@0.395+</span>
          <span>stroke-width: 1.5</span>
          <span>default size: 16px</span>
          <span>color: currentColor</span>
        </div>
      </div>

      {/* Surfaces demo */}
      <div className="section">
        <div className="section-title">Icons on all surfaces</div>
        <div className="section-sub">Icons use currentColor — they adapt to their container automatically.</div>
        <div className="surface-grid">
          <div>
            <div className="surface-card light">
              <div className="surface-label" style={{color:'var(--text-muted)'}}>Light content (bg-card)</div>
              {['LayoutGrid','Users','Map','DollarSign','FileText','Ticket','BarChart2','Lock','Bell','Search','Plus','Check','X','Shield'].map(ic=>(
                <span key={ic} title={ic} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:28,height:28,borderRadius:6,cursor:'pointer'}} onClick={()=>copyToClipboard(`<${ic} />`,setCopied)}>
                  <SvgIcon name={ic} size={16} color="var(--text-secondary)"/>
                </span>
              ))}
            </div>
          </div>
          <div>
            <div className="surface-card dark">
              <div className="surface-label" style={{color:'rgba(226,232,240,0.4)'}}>Sidebar (always dark)</div>
              {['LayoutGrid','Users','Map','DollarSign','FileText','Ticket','BarChart2','Lock','Bell','Search','Plus','Check','X','Shield'].map(ic=>(
                <span key={ic} title={ic} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:28,height:28,borderRadius:6,cursor:'pointer',transition:'background 100ms'}} onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.08)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'} onClick={()=>copyToClipboard(`<${ic} />`,setCopied)}>
                  <SvgIcon name={ic} size={16} color="rgba(226,232,240,0.55)"/>
                </span>
              ))}
            </div>
          </div>
          <div>
            <div className="surface-card brand">
              <div className="surface-label" style={{color:'rgba(255,255,255,0.5)'}}>Brand (primary button)</div>
              {['LayoutGrid','Users','Map','DollarSign','FileText','Ticket','BarChart2','Lock','Bell','Search','Plus','Check','X','Shield'].map(ic=>(
                <span key={ic} title={ic} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:28,height:28,borderRadius:6,cursor:'pointer'}} onClick={()=>copyToClipboard(`<${ic} />`,setCopied)}>
                  <SvgIcon name={ic} size={16} color="rgba(255,255,255,0.9)"/>
                </span>
              ))}
            </div>
          </div>
        </div>
      </div>

      {/* Size demo */}
      <div className="section">
        <div className="section-title">Sizes</div>
        <div style={{background:'#fff',border:'1px solid var(--border-default)',borderRadius:'var(--radius-md)',padding:'20px 24px'}}>
          {SIZES.map(sz=>(
            <div key={sz} className="size-row">
              <span className="sz-label">{sz}px</span>
              {['Search','User','Shield','Bell','Check','Plus','X','ChevronRight','AlertTriangle','DollarSign','Lock','FileText'].map(ic=>(
                <SvgIcon key={ic} name={ic} size={sz} color="var(--text-secondary)"/>
              ))}
              <span style={{fontSize:'var(--text-11)',color:'var(--text-muted)',marginLeft:8}}>
                {sz===14?'Table actions, compact chips':sz===16?'Default — nav icons, inline':sz===18?'Topbar, section headers':'Large — hero, empty states'}
              </span>
            </div>
          ))}
        </div>
      </div>

      {/* Full icon grid */}
      <div className="section">
        <div className="section-title">All Icons ({filtered.length})</div>
        <div style={{fontSize:'var(--text-13)',color:'var(--text-muted)',marginBottom:16}}>Click any card to copy the lucide-react import name.</div>

        <div className="search-bar" style={{marginBottom:20}}>
          <SvgIcon name="Search" size={14} color="var(--text-muted)"/>
          <input placeholder="Search by v1.0 name, lucide name, or use case…" value={search} onChange={e=>setSearch(e.target.value)}/>
          {search && <span style={{cursor:'pointer',color:'var(--text-muted)'}} onClick={()=>setSearch('')}><SvgIcon name="X" size={14} color="var(--text-muted)"/></span>}
        </div>

        <div className="icon-grid">
          {filtered.map(ic=>(
            <div key={ic.v0} className="icon-card" onClick={()=>copyToClipboard(ic.lucide,setCopied)} title={`Click to copy: ${ic.lucide}`} style={{cursor:'pointer'}}>
              <div style={{display:'flex',gap:6,alignItems:'center',background:'var(--bg-subtle)',borderRadius:8,padding:'8px',flexShrink:0}}>
                {SIZES.slice(0,3).map(sz=>(
                  <SvgIcon key={sz} name={ic.lucide} size={sz} color="var(--text-secondary)"/>
                ))}
              </div>
              <div className="icon-info">
                <div className="icon-v0name">{ic.v0}</div>
                <div className="icon-lucide">{ic.lucide}</div>
                <div className="icon-use">{ic.use}</div>
              </div>
            </div>
          ))}
        </div>
        {filtered.length===0&&<div style={{textAlign:'center',padding:'48px',color:'var(--text-muted)'}}>No icons match "{search}"</div>}
      </div>

      {/* Contrast audit */}
      <div className="section">
        <div className="section-title">Icon contrast audit</div>
        <div className="section-sub">Minimum 3:1 required for UI components (WCAG 1.4.11). Icons always paired with text labels in Parwest.</div>
        <table className="contrast-table">
          <thead><tr>{['Icon color','Background','Contrast','WCAG 1.4.11','Note'].map(h=><th key={h}>{h}</th>)}</tr></thead>
          <tbody>
            {[
              ['var(--text-secondary) #334155','White #fff','10.7:1','Pass ✓','Default nav icons'],
              ['var(--text-muted) #64748b','White #fff','4.61:1','Pass ✓','Table header icons'],
              ['rgba(226,232,240,0.55)','Sidebar #0b1224','4.8:1','Pass ✓','Sidebar icons (inactive)'],
              ['var(--sidebar-active-text) #818cf8','Sidebar #0b1224','4.82:1','Pass ✓','Sidebar active icon'],
              ['White #ffffff','Brand #2f5bff','5.0:1','Pass ✓','Primary button icon'],
              ['var(--success-600) #16a34a','White #fff','4.54:1','Pass ✓','Success state icon'],
              ['var(--danger-600) #dc2626','White #fff','4.49:1','Pass ✓','Destructive icon'],
              ['var(--warning-600) #d97706','White #fff','3.18:1','Pass ✓','Warning icon (≥3:1 for icons)'],
            ].map(([c,bg,r,p,n])=>(
              <tr key={c}><td>{c}</td><td>{bg}</td><td style={{fontWeight:700}}>{r}</td><td className="pass">{p}</td><td style={{color:'var(--text-muted)',fontFamily:'var(--font-ui)'}}>{n}</td></tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Copy toast */}
      <div className={`copy-toast${copied?' show':''}`}>
        Copied: {copied}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
