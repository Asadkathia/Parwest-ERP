<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Parwest ERP</title>
<link rel="stylesheet" href="tokens.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
html,body,#root{height:100%;margin:0;}
.app-shell{display:flex;height:100vh;overflow:hidden;}
/* ── Sidebar ── */
.sidebar{width:272px;min-width:272px;background:var(--sidebar-bg);display:flex;flex-direction:column;border-right:1px solid var(--sidebar-border);transition:width var(--duration-normal) var(--ease-standard);overflow:hidden;}
.sidebar.collapsed{width:64px;min-width:64px;}
.sidebar-logo{padding:20px 20px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--sidebar-border);}
.logo-mark{width:32px;height:32px;background:var(--brand-600);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;color:#fff;font-size:15px;letter-spacing:-0.5px;}
.logo-text{color:var(--sidebar-text);font-size:var(--text-16);font-weight:700;white-space:nowrap;letter-spacing:-0.3px;}
.logo-sub{color:var(--sidebar-text-muted);font-size:var(--text-11);font-weight:500;letter-spacing:0.5px;text-transform:uppercase;white-space:nowrap;}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 8px;scrollbar-width:none;}
.sidebar-nav::-webkit-scrollbar{display:none;}
.nav-section-label{padding:8px 12px 4px;font-size:var(--text-11);font-weight:600;color:var(--sidebar-text-muted);text-transform:uppercase;letter-spacing:0.8px;white-space:nowrap;overflow:hidden;}
.nav-item{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--sidebar-text-muted);font-size:var(--text-13);font-weight:500;transition:all var(--duration-fast);white-space:nowrap;margin-bottom:2px;position:relative;}
.nav-item:hover{background:var(--sidebar-hover-bg);color:var(--sidebar-text);}
.nav-item.active{background:var(--sidebar-active-bg);color:var(--sidebar-active-text);}
.nav-item svg{flex-shrink:0;width:18px;height:18px;}
.nav-badge{margin-left:auto;background:var(--danger-600);color:#fff;border-radius:var(--radius-full);font-size:10px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center;}
.sidebar-footer{padding:12px 8px;border-top:1px solid var(--sidebar-border);}
.user-card{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;transition:background var(--duration-fast);}
.user-card:hover{background:var(--sidebar-hover-bg);}
.avatar{width:32px;height:32px;border-radius:var(--radius-full);background:var(--brand-700);color:#fff;display:flex;align-items:center;justify-content:center;font-size:var(--text-12);font-weight:700;flex-shrink:0;}
.user-info{flex:1;min-width:0;}
.user-name{color:var(--sidebar-text);font-size:var(--text-13);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-role{color:var(--sidebar-text-muted);font-size:var(--text-11);white-space:nowrap;}
/* ── Top Bar ── */
.topbar{height:56px;background:var(--bg-card);border-bottom:1px solid var(--border-default);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0;}
.topbar-title{font-size:var(--text-16);font-weight:600;color:var(--text-primary);flex:1;}
.topbar-sub{font-size:var(--text-13);color:var(--text-muted);}
.tb-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-sm);font-size:var(--text-13);font-weight:500;cursor:pointer;transition:all var(--duration-fast);border:1px solid transparent;}
.tb-btn-primary{background:var(--brand-600);color:#fff;border-color:var(--brand-600);}
.tb-btn-primary:hover{background:var(--brand-700);}
.tb-btn-ghost{background:transparent;color:var(--text-secondary);border-color:var(--border-default);}
.tb-btn-ghost:hover{background:var(--bg-subtle);}
.tb-icon-btn{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);transition:all var(--duration-fast);border:none;background:transparent;}
.tb-icon-btn:hover{background:var(--bg-subtle);color:var(--text-primary);}
/* ── Content ── */
.content-area{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-page);}
.content-scroll{flex:1;overflow-y:auto;padding:24px;}
/* ── Cards ── */
.card{background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-xs);}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border-default);display:flex;align-items:center;justify-content:space-between;}
.card-body{padding:20px;}
/* ── KPI cards ── */
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-bottom:24px;}
.kpi-card{background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:16px 20px;box-shadow:var(--shadow-xs);}
.kpi-label{font-size:var(--text-12);font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;}
.kpi-value{font-size:var(--text-24);font-weight:700;color:var(--text-primary);font-variant-numeric:tabular-nums;line-height:1.2;}
.kpi-trend{font-size:var(--text-12);color:var(--text-muted);margin-top:4px;display:flex;align-items:center;gap:4px;}
.kpi-trend.up{color:var(--success-600);}
.kpi-trend.down{color:var(--danger-600);}
/* ── Chips / Status ── */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:var(--radius-full);font-size:var(--text-12);font-weight:600;letter-spacing:0.2px;}
.chip-dot{width:6px;height:6px;border-radius:var(--radius-full);flex-shrink:0;}
.chip-active{background:var(--success-50);color:var(--success-700);}
.chip-active .chip-dot{background:var(--success-600);}
.chip-inactive{background:var(--slate-100);color:var(--slate-600);}
.chip-inactive .chip-dot{background:var(--slate-400);}
.chip-pending{background:var(--warning-50);color:var(--warning-700);}
.chip-pending .chip-dot{background:var(--warning-500);}
.chip-terminated{background:var(--danger-50);color:var(--danger-700);}
.chip-terminated .chip-dot{background:var(--danger-600);}
.chip-brand{background:var(--brand-50);color:var(--brand-700);}
.chip-day{background:#eff6ff;color:#1d4ed8;}
.chip-night{background:#eef2ff;color:#4338ca;}
.chip-both{background:#faf5ff;color:#7e22ce;}
.chip-draft{background:var(--slate-100);color:var(--slate-600);}
.chip-calculated{background:var(--info-50);color:var(--info-600);}
.chip-locked{background:var(--warning-50);color:var(--warning-700);}
.chip-finalized{background:var(--success-50);color:var(--success-700);}
.chip-paid{background:var(--emerald-50);color:var(--emerald-600);}
.chip-hold{background:var(--danger-50);color:var(--danger-700);}
.role-chip{background:var(--brand-50);color:var(--brand-700);border-radius:var(--radius-full);padding:2px 10px;font-size:var(--text-12);font-weight:600;}
/* ── Table ── */
.data-table{width:100%;border-collapse:collapse;font-size:var(--text-13);}
.data-table thead tr{border-bottom:1px solid var(--border-default);}
.data-table th{padding:10px 14px;text-align:left;font-size:var(--text-12);font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;cursor:pointer;user-select:none;}
.data-table th:hover{color:var(--text-primary);}
.data-table td{padding:0 14px;color:var(--text-primary);border-bottom:1px solid var(--border-default);white-space:nowrap;}
.data-table tbody tr{transition:background var(--duration-fast);}
.data-table tbody tr:hover{background:var(--bg-card-hover);}
.data-table tbody tr:last-child td{border-bottom:none;}
.row-comfortable td{height:var(--row-comfortable);}
.row-compact td{height:var(--row-compact);font-size:var(--text-12);}
/* ── Filter bar ── */
.filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.search-input{display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:8px 12px;flex:1;max-width:320px;}
.search-input input{border:none;outline:none;background:transparent;font-size:var(--text-13);color:var(--text-primary);width:100%;font-family:var(--font-ui);}
.search-input input::placeholder{color:var(--text-placeholder);}
.filter-select{background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:8px 12px;font-size:var(--text-13);color:var(--text-primary);font-family:var(--font-ui);cursor:pointer;}
.filter-select:focus{outline:none;box-shadow:var(--focus-ring);}
/* ── Stat cards ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.stat-card{background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:14px 18px;display:flex;align-items:flex-start;gap:12px;}
.stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stat-body .label{font-size:var(--text-12);color:var(--text-muted);font-weight:500;margin-bottom:2px;}
.stat-body .value{font-size:var(--text-20);font-weight:700;font-variant-numeric:tabular-nums;color:var(--text-primary);}
/* ── Tabs ── */
.tabs{display:flex;border-bottom:1px solid var(--border-default);overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab-item{padding:10px 16px;font-size:var(--text-13);font-weight:500;color:var(--text-muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all var(--duration-fast);flex-shrink:0;}
.tab-item:hover{color:var(--text-primary);}
.tab-item.active{color:var(--brand-600);border-bottom-color:var(--brand-600);}
/* ── Avatar initials ── */
.guard-avatar{width:28px;height:28px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;}
/* ── Attention strip ── */
.attention-strip{display:flex;gap:10px;overflow-x:auto;padding:12px 0;scrollbar-width:none;margin-bottom:20px;}
.attention-strip::-webkit-scrollbar{display:none;}
.attention-item{background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:10px 14px;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:8px;font-size:var(--text-13);}
.attention-item.high{border-left:3px solid var(--danger-600);}
.attention-item.medium{border-left:3px solid var(--warning-600);}
/* ── Insight rows ── */
.insight-row{padding:12px 16px;border-left:3px solid transparent;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--border-default);cursor:pointer;}
.insight-row:last-child{border-bottom:none;}
.insight-row.high{border-left-color:var(--danger-600);}
.insight-row.medium{border-left-color:var(--warning-500);}
.insight-row.low{border-left-color:var(--slate-300);}
.insight-row:hover{background:var(--bg-card-hover);}
.insight-badge{min-width:28px;height:20px;background:var(--bg-subtle);border-radius:var(--radius-full);font-size:10px;font-weight:700;color:var(--text-muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
/* ── KPI strip (guard) ── */
.kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--border-default);border-radius:var(--radius-md);overflow:hidden;background:var(--bg-card);margin-bottom:20px;}
.kpi-strip-tile{padding:14px 16px;border-right:1px solid var(--border-default);text-align:center;}
.kpi-strip-tile:last-child{border-right:none;}
.kpi-strip-tile .v{font-size:var(--text-20);font-weight:700;font-variant-numeric:tabular-nums;color:var(--text-primary);}
.kpi-strip-tile .l{font-size:var(--text-11);color:var(--text-muted);font-weight:500;text-transform:uppercase;letter-spacing:0.4px;margin-top:2px;}
/* ── Detail grid ── */
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.detail-field{display:flex;flex-direction:column;gap:2px;}
.detail-field .fl{font-size:var(--text-11);font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;}
.detail-field .fv{font-size:var(--text-13);color:var(--text-primary);font-weight:500;}
/* ── Lifecycle progress ── */
.lifecycle{display:flex;align-items:center;gap:0;overflow:hidden;}
.lc-step{display:flex;align-items:center;gap:0;flex:1;}
.lc-node{width:8px;height:8px;border-radius:50%;background:var(--slate-300);flex-shrink:0;}
.lc-node.done{background:var(--brand-600);}
.lc-node.current{background:var(--brand-600);box-shadow:0 0 0 3px var(--brand-100);}
.lc-line{flex:1;height:2px;background:var(--slate-200);}
.lc-line.done{background:var(--brand-600);}
.lc-label{font-size:10px;color:var(--text-muted);font-weight:600;text-align:center;margin-top:4px;}
/* ── Progress bar ── */
.progress-bar{height:6px;background:var(--bg-subtle);border-radius:var(--radius-full);overflow:hidden;margin-bottom:4px;}
.progress-fill{height:100%;border-radius:var(--radius-full);background:var(--brand-600);}
/* ── Stepper ── */
.stepper{display:flex;align-items:center;gap:0;margin-bottom:28px;}
.step-node{display:flex;align-items:center;gap:0;flex:1;}
.step-circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--text-12);font-weight:700;flex-shrink:0;border:2px solid var(--border-default);color:var(--text-muted);background:var(--bg-card);}
.step-circle.done{background:var(--brand-600);border-color:var(--brand-600);color:#fff;}
.step-circle.current{background:var(--brand-600);border-color:var(--brand-600);color:#fff;box-shadow:0 0 0 4px var(--brand-100);}
.step-label{font-size:var(--text-12);font-weight:600;color:var(--text-muted);margin-top:6px;white-space:nowrap;}
.step-label.active{color:var(--brand-600);}
.step-line{flex:1;height:2px;background:var(--border-default);margin:0 8px;}
.step-line.done{background:var(--brand-600);}
/* ── Form ── */
.form-group{margin-bottom:18px;}
.form-label{display:block;font-size:var(--text-12);font-weight:600;color:var(--text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.4px;}
.form-label .req{color:var(--danger-600);}
.form-input{width:100%;padding:9px 12px;background:var(--bg-input);border:1px solid var(--border-default);border-radius:var(--radius-sm);font-size:var(--text-14);color:var(--text-primary);font-family:var(--font-ui);transition:border-color var(--duration-fast),box-shadow var(--duration-fast);}
.form-input:focus{outline:none;border-color:var(--border-focus);box-shadow:var(--focus-ring);}
.form-input.mono{font-family:var(--font-mono);}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-3col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.form-section{margin-bottom:28px;}
.form-section-title{font-size:var(--text-14);font-weight:700;color:var(--text-primary);margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border-default);}
/* ── Payroll workflow ── */
.workflow-bar{display:flex;align-items:center;background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-md);overflow:hidden;margin-bottom:24px;}
.wf-stage{flex:1;padding:14px 12px;text-align:center;border-right:1px solid var(--border-default);cursor:pointer;transition:background var(--duration-fast);}
.wf-stage:last-child{border-right:none;}
.wf-stage.done{background:var(--brand-50);}
.wf-stage.current{background:var(--brand-600);}
.wf-stage.current .wf-label{color:#fff;}
.wf-stage.current .wf-sub{color:rgba(255,255,255,0.7);}
.wf-label{font-size:var(--text-12);font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;}
.wf-label.done{color:var(--brand-700);}
.wf-sub{font-size:10px;color:var(--text-muted);margin-top:2px;}
/* ── Permission matrix ── */
.perm-matrix{width:100%;border-collapse:collapse;font-size:var(--text-12);}
.perm-matrix th,.perm-matrix td{padding:8px 10px;border:1px solid var(--border-default);text-align:center;}
.perm-matrix th{background:var(--bg-subtle);font-weight:600;color:var(--text-muted);}
.perm-matrix .module-name{text-align:left;font-weight:600;color:var(--text-primary);background:var(--bg-card);}
.perm-matrix .role-header{background:var(--bg-subtle);font-weight:700;color:var(--text-primary);}
.perm-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border-default);display:flex;align-items:center;justify-content:center;margin:0 auto;cursor:pointer;transition:all var(--duration-fast);}
.perm-check.granted{background:var(--brand-600);border-color:var(--brand-600);}
/* ── Audit JSON diff ── */
.json-diff{background:#0d1117;border-radius:var(--radius-sm);padding:12px;font-family:var(--font-mono);font-size:11px;line-height:1.7;overflow-x:auto;}
.json-diff .removed{color:#ff6b6b;background:rgba(220,38,38,0.1);}
.json-diff .added{color:#6bffb8;background:rgba(22,163,74,0.1);}
.json-diff .unchanged{color:#64748b;}
/* ── Login ── */
.login-shell{display:flex;height:100vh;}
.login-brand{width:480px;background:var(--sidebar-bg);display:flex;flex-direction:column;justify-content:center;padding:64px;}
.login-form-panel{flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg-page);}
.login-form-box{width:100%;max-width:400px;padding:0 24px;}
.login-mark{width:48px;height:48px;background:var(--brand-600);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;margin-bottom:32px;letter-spacing:-1px;}
/* ── Empty state ── */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 24px;text-align:center;}
.empty-icon{width:48px;height:48px;border-radius:var(--radius-md);background:var(--bg-subtle);display:flex;align-items:center;justify-content:center;margin-bottom:16px;color:var(--text-muted);}
/* ── Toast ── */
.toast-stack{position:fixed;top:20px;right:20px;z-index:var(--z-toast);display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:12px 16px;box-shadow:var(--shadow-md);display:flex;align-items:center;gap:10px;font-size:var(--text-13);animation:slideIn var(--duration-normal) var(--ease-standard);}
.toast.success{border-left:3px solid var(--success-600);}
.toast.error{border-left:3px solid var(--danger-600);}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
/* ── Density btn ── */
.density-toggle{display:flex;gap:2px;background:var(--bg-subtle);border-radius:var(--radius-sm);padding:2px;}
.density-btn{padding:4px 10px;border-radius:6px;font-size:var(--text-12);font-weight:500;cursor:pointer;color:var(--text-muted);transition:all var(--duration-fast);}
.density-btn.active{background:var(--bg-card);color:var(--text-primary);box-shadow:var(--shadow-xs);}
/* ── Section title ── */
.section-title{font-size:var(--text-20);font-weight:700;color:var(--text-primary);}
.section-sub{font-size:var(--text-13);color:var(--text-muted);margin-top:2px;}
/* ── Ops feed ── */
.ops-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-default);}
.ops-item:last-child{border-bottom:none;}
.ops-dot{width:8px;height:8px;border-radius:50%;background:var(--brand-400);flex-shrink:0;margin-top:4px;}
.ops-text{font-size:var(--text-13);color:var(--text-primary);line-height:1.5;}
.ops-time{font-size:var(--text-11);color:var(--text-muted);margin-top:2px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

// ── Data ─────────────────────────────────────────────────────
const GUARDS = [

// ── Helpers ───────────────────────────────────────────────────
const fmt = n => `₨ ${n >= 10000000 ? (n/10000000).toFixed(1)+'Cr' : n >= 100000 ? (n/100000).toFixed(1)+'L' : n >= 1000 ? (n/1000).toFixed(0)+'K' : n}`;
const fmtFull = n => `₨ ${n.toLocaleString()}`;

function initials(name){return name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function avatarColor(name){const hues=[210,180,150,30,270,0,300,60];return `hsl(${hues[name.charCodeAt(0)%8]},55%,35%)`;}

function StatusChip({status}){
  const map={
    ACTIVE:'active',PRESENT:'active',PAID:'paid',FULFILLED:'paid',
    INACTIVE:'inactive',ENDED:'inactive',CANCELLED:'inactive',
    PENDING:'pending',DRAFT:'draft',CALCULATED:'calculated',SENT:'calculated',
    TERMINATED:'terminated',REJECTED:'terminated',HOLD:'hold',
    REGIONAL_LOCKED:'locked',GLOBAL_FINALIZED:'finalized',
    DAY:'day',NIGHT:'night',BOTH:'both',
    BLACKLISTED:'terminated',
  };
  const c=map[status]||'draft';
  const labels={active:'Active',inactive:'Inactive',pending:'Pending',draft:'Draft',terminated:'Terminated',paid:'Paid',hold:'On Hold',locked:'Locked',finalized:'Finalized',calculated:'Calculated',day:'Day',night:'Night',both:'Both'};
  return <span className={`chip chip-${c}`}><span className="chip-dot"/>{labels[c]||status}</span>;
}

function Login({onLogin}){
  const [email,setEmail]=useState('');
  const [pw,setPw]=useState('');
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);

  const submit=e=>{
    e.preventDefault();
    if(!email||!pw){setErr('Please enter your email and password.');return;}
    setLoading(true);setErr('');
    setTimeout(()=>{setLoading(false);onLogin();},800);
  };

  return (
    <div className="login-shell">
      <div className="login-brand">
        <div style={{marginBottom:48}}>
          <div style={{width:52,height:52,background:'var(--brand-600)',borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,fontWeight:800,color:'#fff',marginBottom:24,letterSpacing:-1}}>P</div>

        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          {[['₨ 4.2Cr','Monthly payroll processed'],['1,247','Active guards managed'],['89','Client sites secured']].map(([v,l])=>(
            <div key={l} style={{display:'flex',alignItems:'center',gap:12}}>
              <div style={{width:8,height:8,borderRadius:'50%',background:'var(--brand-400)',flexShrink:0}}/>
              <span style={{fontFamily:'var(--font-mono)',fontSize:'var(--text-13)',color:'var(--brand-300)',fontVariantNumeric:'tabular-nums'}}>{v}</span>
              <span style={{fontSize:'var(--text-13)',color:'rgba(226,232,240,0.5)'}}>{l}</span>
            </div>
          ))}
        </div>
      </div>

            <div style={{fontSize:'var(--text-24)',fontWeight:700,color:'var(--text-primary)',marginBottom:6}}>Sign in to Parwest</div>

              <label className="form-label">Email address</label>

              <label className="form-label">Password</label>
              <input className="form-input" type="password" placeholder="••••••••" value={pw} onChange={e=>setPw(e.target.value)}/>

// ── Guards List Screen ────────────────────────────────────────
function GuardsScreen({onProfile,showToast}){
  const [density,setDensity]=useState('comfortable');
  const [search,setSearch]=useState('');
  const [statusFilter,setStatusFilter]=useState('All');
  const [selected,setSelected]=useState([]);
  const [sortCol,setSortCol]=useState('id');
  const [sortDir,setSortDir]=useState('asc');

  const filtered=GUARDS.filter(g=>{
    const matchSearch=!search||g.name.toLowerCase().includes(search.toLowerCase())||g.id.toLowerCase().includes(search.toLowerCase())||g.cnic.includes(search);
    const matchStatus=statusFilter==='All'||g.lifecycle===statusFilter;
    return matchSearch&&matchStatus;
  });

  const sorted=[...filtered].sort((a,b)=>{
    const va=a[sortCol]||'', vb=b[sortCol]||'';
    return (va<vb?-1:va>vb?1:0)*(sortDir==='asc'?1:-1);
  });

  const toggleSelect=id=>setSelected(sel=>sel.includes(id)?sel.filter(s=>s!==id):[...sel,id]);
  const toggleAll=()=>setSelected(selected.length===sorted.length?[]:sorted.map(g=>g.id));

  const sortBy=col=>{ if(sortCol===col)setSortDir(d=>d==='asc'?'desc':'asc'); else{setSortCol(col);setSortDir('asc');}};

  return (
    <div>
      {/* Header */}
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:20}}>
        <div><div className="section-title">Guards</div><div className="section-sub">Manage guard profiles and deployments</div></div>
        <button className="tb-btn tb-btn-primary"><Icon n="plus" s={15}/> Add Guard</button>
      </div>

      {/* Stat cards */}
      <div className="stat-grid">
        {[
          {label:'Total Guards',value:'1,247',icon:'users',color:'var(--brand-600)',bg:'var(--brand-50)'},
          {label:'Active',value:'1,108',icon:'check',color:'var(--success-600)',bg:'var(--success-50)'},
          {label:'Inactive',value:'89',icon:'alertTri',color:'var(--warning-600)',bg:'var(--warning-50)'},
          {label:'Pending',value:'50',icon:'user',color:'var(--slate-500)',bg:'var(--slate-100)'},
        ].map(s=>(
          <div key={s.label} className="stat-card">
            <div className="stat-icon" style={{background:s.bg}}><Icon n={s.icon} s={18} c={s.color}/></div>
            <div className="stat-body"><div className="label">{s.label}</div><div className="value" style={{color:s.color}}>{s.value}</div></div>
          </div>
        ))}
      </div>

      {/* Filter bar */}
      <div className="filter-bar">
        <div className="search-input">
          <Icon n="search" s={14} c="var(--text-placeholder)"/>
          <input placeholder="Search by name, Parwest ID, CNIC…" value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        {['All','ACTIVE','INACTIVE','PENDING','TERMINATED'].map(s=>(
          <button key={s} className="density-btn" style={{background:statusFilter===s?'var(--brand-600)':undefined,color:statusFilter===s?'#fff':undefined}} onClick={()=>setStatusFilter(s)}>{s==='All'?'All Status':s}</button>
        ))}
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:'var(--text-12)',color:'var(--text-muted)'}}>Density:</span>
          <div className="density-toggle">
            <span className={`density-btn${density==='comfortable'?' active':''}`} onClick={()=>setDensity('comfortable')}>Comfortable</span>
            <span className={`density-btn${density==='compact'?' active':''}`} onClick={()=>setDensity('compact')}>Compact</span>
          </div>
        </div>
      </div>

      {/* Bulk bar */}
      {selected.length>0 && (
        <div style={{background:'var(--brand-50)',border:'1px solid var(--brand-200)',borderRadius:'var(--radius-sm)',padding:'10px 16px',display:'flex',alignItems:'center',gap:12,marginBottom:12,fontSize:'var(--text-13)'}}>
          <strong style={{color:'var(--brand-700)'}}>{selected.length} guard{selected.length>1?'s':''} selected</strong>
          <button className="tb-btn tb-btn-ghost" style={{padding:'5px 12px',fontSize:'var(--text-12)'}} onClick={()=>{showToast('Export started');setSelected([])}}>Bulk Export</button>
          <button className="tb-btn tb-btn-ghost" style={{padding:'5px 12px',fontSize:'var(--text-12)'}}>Change Status</button>
          <button className="tb-icon-btn" style={{marginLeft:'auto'}} onClick={()=>setSelected([])}><Icon n="x" s={15}/></button>
        </div>
      )}

      {/* Table */}
      <div className="card" style={{overflow:'hidden'}}>
        <div style={{overflowX:'auto'}}>
          <table className="data-table">
            <thead>
              <tr>
                <th style={{width:40}}><input type="checkbox" checked={selected.length===sorted.length&&sorted.length>0} onChange={toggleAll} style={{cursor:'pointer'}}/></th>
                {[['id','Parwest ID'],['name','Name'],['cnic','CNIC'],['designation','Designation'],['shift','Shift'],['region','Region / Office'],['lifecycle','Status']].map(([col,label])=>(
                  <th key={col} onClick={()=>sortBy(col)}>
                    {label} {sortCol===col?(sortDir==='asc'?'↑':'↓'):''}
                  </th>
                ))}
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              {sorted.length===0 ? (
                <tr><td colSpan={9} style={{textAlign:'center',padding:'48px 0',color:'var(--text-muted)',fontSize:'var(--text-14)'}}>
                  No guards found matching your search.
                </td></tr>
              ) : sorted.map(g=>(
                <tr key={g.id} className={density==='compact'?'row-compact':'row-comfortable'} onClick={onProfile} style={{cursor:'pointer'}}>
                  <td onClick={e=>e.stopPropagation()}><input type="checkbox" checked={selected.includes(g.id)} onChange={()=>toggleSelect(g.id)} style={{cursor:'pointer'}}/></td>
                  <td><span className="mono" style={{fontSize:'var(--text-12)',color:'var(--text-muted)'}}>{g.id}</span></td>
                  <td>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <div className="guard-avatar" style={{background:avatarColor(g.name)}}>{initials(g.name)}</div>
                      <span style={{fontWeight:500}}>{g.name}</span>
                    </div>
                  </td>
                  <td><span className="mono" style={{fontSize:'var(--text-12)'}}>{g.cnic}</span></td>
                  <td>{g.designation}</td>
                  <td><span className={`chip chip-${g.shift==='DAY'?'day':g.shift==='NIGHT'?'night':'both'}`}>{g.shift}</span></td>
                  <td><span style={{fontSize:'var(--text-12)'}}>{g.region}</span><span style={{color:'var(--text-muted)',fontSize:'var(--text-11)',display:'block'}}>{g.office}</span></td>
                  <td><StatusChip status={g.lifecycle}/></td>
                  <td onClick={e=>e.stopPropagation()}>
                    <div style={{display:'flex',gap:6}}>
                      <button className="tb-btn tb-btn-ghost" style={{padding:'4px 10px',fontSize:'var(--text-12)'}} onClick={onProfile}>View</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{padding:'12px 16px',borderTop:'1px solid var(--border-default)',display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:'var(--text-12)',color:'var(--text-muted)'}}>
          <span>Showing {sorted.length} of 1,247 guards</span>
          <div style={{display:'flex',gap:4}}>
            {[1,2,3,'…',42].map((p,i)=><button key={i} className="density-btn" style={{padding:'4px 8px',background:p===1?'var(--brand-600)':undefined,color:p===1?'#fff':undefined}}>{p}</button>)}
          </div>
        </div>
      </div>
    </div>
  );
}

              <th/>
              {roles.map(r=>['C','V','U','D','R'].map(p=><th key={`${r}-${p}`} style={{padding:'4px 6px',fontSize:10}}>{p}</th>))}
            </tr>
          </thead>
          <tbody>{modules.map((m,mi)=>(
            <tr key={m.name}>
              <td className="module-name">{m.name}</td>
              {roles.map((r,ri)=>['C','V','U','D','R'].map((p,pi)=>(
                <td key={`${ri}-${pi}`} style={{padding:'6px'}}>
                  <div className={`perm-check${matrix[mi][ri][pi]?' granted':''}`} onClick={()=>toggle(mi,ri,pi)} title={`Toggle ${p} for ${r} on ${m.name}`}>
                    {matrix[mi][ri][pi] && <Icon n="check" s={10} c="#fff"/>}
                  </div>
                </td>
              )))}
            </tr>
          ))}</tbody>
        </table>
      </div>
    </div>
  );
}

// ── Reports Screen ────────────────────────────────────────────
function ReportsScreen(){

  const tabs=['Guard Analytics','Payroll','Deployment','Finance'];

  // Bar chart using CSS
  const BarChart = ({data,color='var(--brand-600)',height=120}) => {
    const max=Math.max(...data.map(d=>d.v));
    return (
      <div style={{display:'flex',alignItems:'flex-end',gap:4,height}}>
        {data.map((d,i)=>(
          <div key={i} style={{display:'flex',flexDirection:'column',alignItems:'center',flex:1,gap:4}}>
            <div style={{fontSize:9,color:'var(--text-muted)',fontFamily:'var(--font-mono)',fontVariantNumeric:'tabular-nums'}}>{d.v>=1000?(d.v/1000).toFixed(1)+'K':d.v}</div>
            <div style={{width:'100%',background:color,borderRadius:'3px 3px 0 0',height:`${(d.v/max)*100}%`,minHeight:4,transition:'height 0.3s',opacity:i===data.length-1?1:0.6+i*0.05}}/>
            <div style={{fontSize:9,color:'var(--text-muted)',textAlign:'center',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:40}}>{d.l}</div>
          </div>
        ))}
      </div>
    );
  };

  const LineChart = ({data,color='var(--brand-600)'}) => {
    const max=Math.max(...data.map(d=>d.v));
    const min=Math.min(...data.map(d=>d.v));
    const range=max-min||1;
    const w=100/(data.length-1);
    const points=data.map((d,i)=>`${i*w},${100-((d.v-min)/range)*85}`).join(' ');
    return (
      <div style={{position:'relative',height:80}}>
        <svg width="100%" height="80" viewBox={`0 0 100 100`} preserveAspectRatio="none">
          <polyline points={points} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke"/>
          <polyline points={`0,100 ${points} 100,100`} fill={color} fillOpacity="0.08" stroke="none"/>
          {data.map((d,i)=><circle key={i} cx={i*w} cy={100-((d.v-min)/range)*85} r="3" fill={color} vectorEffect="non-scaling-stroke"/>)}
        </svg>
      </div>
    );
  };

    <div>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:20}}>

        {tabs.map((t,i)=><div key={i} className={`tab-item${activeTab===i?' active':''}`} onClick={()=>setActiveTab(i)}>{t}</div>)}
      </div>

      {activeTab===0 && (
        <div>
          {/* KPIs */}
          <div className="kpi-grid" style={{gridTemplateColumns:'repeat(4,1fr)',marginBottom:20}}>
            {[{l:'Total Guards',v:'1,247',trend:'+14',up:true},{l:'Deployed',v:'1,108',trend:'88.9%',up:true},{l:'Vacant',v:'139',trend:'11.1%',up:false},{l:'New This Month',v:'23',trend:'+8',up:true}].map((k,i)=>(
              <div key={i} className="kpi-card"><div className="kpi-label">{k.l}</div><div className="kpi-value">{k.v}</div><div className={`kpi-trend ${k.up?'up':'down'}`}>{k.up?'▲':'▼'} {k.trend}</div></div>
            ))}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,marginBottom:20}}>
            {/* Guard headcount by region */}
            <div className="card">
              <div className="card-header"><div style={{fontWeight:700,fontSize:'var(--text-14)'}}>Guards by Region</div><span style={{fontSize:'var(--text-12)',color:'var(--text-muted)'}}>Active only</span></div>
              <div className="card-body">
                <BarChart color="var(--brand-600)" data={[{l:'Lahore',v:412},{l:'Karachi',v:298},{l:'Islamabad',v:187},{l:'Rawalpindi',v:143},{l:'Faisalabad',v:98},{l:'Multan',v:72},{l:'Peshawar',v:64},{l:'Quetta',v:34}]}/>
